name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/business_intelligence
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Create application database
        run: |
          node --input-type=module -e "import postgres from 'postgres'; const s=postgres(process.env.TEST_DATABASE_URL); await s.unsafe('create database business_intelligence'); await s.end();"
      - name: Apply migrations to PostgreSQL
        run: npm run db:migrate
      - name: Tests (PGlite)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-pglite.log
      - name: Tests (PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee test-postgres.log
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            test-pglite.log
            test-postgres.log
            .next/*.log
          if-no-files-found: ignore
          retention-days: 7
