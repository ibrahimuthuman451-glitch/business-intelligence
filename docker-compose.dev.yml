# Local dependencies for development/staging rehearsal. Not used by CI directly.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_intelligence
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes: ["clamdb:/var/lib/clamav"]

volumes:
  pgdata:
  clamdb:
